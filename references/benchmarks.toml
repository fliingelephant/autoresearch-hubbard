system = { Lx = 16, Ly = 8, bc = { x = "OBC", y = "PBC" }, t = 1, t_prime = -0.2, U = 8, filling = "unspecified" }
source = { ref = "gu2025", section = "S4.2" }
note = "§S4.2 does not state filling or axis-BC mapping. 'Cylinder' follows the common convention (OBC long axis, PBC short axis)."
methods = [
    { name = "DMRG", e_per_site = -0.72747, bond_dim = "m=40000" },
    { name = "NQS",  e_per_site = -0.72791, cite = "gu2025" },
]


