# ============================================================================
# Table S4: accuracy comparison with prior NQS methods
# Absolute energies not reported; only relative error vs exact solution.
# ============================================================================

[[accuracy_benchmarks]]
method = "RBM+SR"
paper_ref = "Gu et al. ref (18)"
label_in_fig1C = "RBM+SR, 2017"
system = { Lx = 8, Ly = 8, doping = 0 }
rel_error = 0.003
accuracy = 0.997
source = { ref = "gu2025", table = "S4" }

[[accuracy_benchmarks]]
method = "MLP+NNB"
paper_ref = "Gu et al. ref (20)"
cite = "luo2019"
system = { Lx = 4, Ly = 4, doping = 0.125 }
rel_error = 0.01
accuracy = 0.99
source = { ref = "gu2025", table = "S4" }

[[accuracy_benchmarks]]
method = "MLP+Symmetry"
paper_ref = "Gu et al. ref (19)"
label_in_fig1C = "MLP+Symmetry, 2021"
system = { Lx = 4, Ly = 4, doping = 0.375 }
rel_error = 0.0005
accuracy = 0.9995
source = { ref = "gu2025", table = "S4" }

[[accuracy_benchmarks]]
method = "MLP+HFDS+SR"
paper_ref = "Gu et al. ref (21)"
cite = "robledo2022"
system = { Lx = 4, Ly = 4, doping = 0.125 }
rel_error = 0.001
accuracy = 0.999
