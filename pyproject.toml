[project]
name = "autoresearch-hubbard"
version = "0.1.0"
description = "Paper-faithful NQS for the 2D Hubbard model with an autoresearch-style harness"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "netket @ git+https://github.com/fliingelephant/netket.git@main",
    "flax",
    "numpy",
    "optax",
    "scipy",
    "matplotlib",
]

[project.optional-dependencies]
cpu = ["jax[cpu]"]
cuda = ["jax[cuda13]"]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/autoresearch_hubbard"]

[tool.uv]
conflicts = [
    [{ extra = "cpu" }, { extra = "cuda" }],
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
