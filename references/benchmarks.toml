# Benchmark energies for the 2D Hubbard model.
#
# All energies are per-site (E / N_sites), in units of the hopping t.
# All entries are verbatim from Gu et al. 2025 (arXiv:2507.02644), either the
# paper's own NQS numbers or the comparison values they report for prior works.
#
# Convention:
#   bc       = "OBC" or "PBC" (both directions); {x=..., y=...} for cylinders.
#   filling  = "half", "1/8-doped", "3/8-doped", or "unspecified".
#   err      = stated 1-sigma uncertainty on the last digits of e_per_site.
#   cite     = key into [refs] for the paper that originally reported the value.
#   source   = where in Gu et al. 2025 the number appears.
#
# This file is frozen (listed in frozen-manifest.toml). Any edit requires a
# /rehash + rotation of the FROZEN_MANIFEST_SHA CI secret.


# ============================================================================
# Cited references
# ============================================================================

[refs.gu2025]
authors = "Gu, Li, Lin, Zhan, et al."
title = "Solving the Hubbard model with Neural Quantum States"
arxiv = "2507.02644"
url = "https://arxiv.org/abs/2507.02644"
year = 2025

[refs.liu2025]
authors = "Liu, Zhai, Peng, Gu, Chan"
title = "Accurate Simulation of the Hubbard Model with Finite Fermionic Projected Entangled Pair States"
journal = "Phys. Rev. Lett. 134, 256502"
doi = "10.1103/r4q9-4yvj"
url = "https://link.aps.org/doi/10.1103/r4q9-4yvj"
year = 2025

[refs.qin2016]
authors = "Qin, Shi, Zhang"
title = "Benchmark study of the two-dimensional Hubbard model with auxiliary-field quantum Monte Carlo method"
journal = "Phys. Rev. B 94, 085103"
url = "https://journals.aps.org/prb/abstract/10.1103/PhysRevB.94.085103"
year = 2016

[refs.robledo2022]
# Gu et al. reference (21); HFDS (Hidden-Fermion Determinant States).
authors = "Robledo Moreno et al."
label = "MLP+HFDS+SR"
year = 2022

[refs.luo2019]
# Gu et al. reference (20); MLP backflow (NNB).
authors = "Luo, Clark"
label = "MLP+NNB"
year = 2019


# ============================================================================
# Table S1: pure Hubbard, half-filled, PBC
# ============================================================================

[[benchmarks]]
id = "8x8_pbc_half"
system = { Lx = 8, Ly = 8, bc = "PBC", t = 1, t_prime = 0, U = 8, filling = "half" }
source = { ref = "gu2025", table = "S1" }
methods = [
    { name = "AFQMC", e_per_site = -0.5262,  err = 0.0005, cite = "qin2016" },
    { name = "NQS",   e_per_site = -0.52582,               cite = "gu2025" },
]

[[benchmarks]]
id = "10x10_pbc_half"
system = { Lx = 10, Ly = 10, bc = "PBC", t = 1, t_prime = 0, U = 8, filling = "half" }
